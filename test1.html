<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金門拼圖 - 偵錯模式</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a1a1a; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
<script>
const config = {
    type: Phaser.AUTO,
    width: 1024,
    height: 768,
    backgroundColor: '#2c3e50',
    scene: { preload: preload, create: create }
};

const game = new Phaser.Game(config);

function preload() {
    // 這裡一定要確認檔名跟 VS Code 左側顯示的一模一樣 (連 .png 還是 .PNG 都要一樣)
    this.load.image('bg_map', 'map.png'); 

    // 監聽載入錯誤
    this.load.on('loaderror', function (file) {
        console.error('圖片載入失敗:', file.src);
    });
}

function create() {
    // --- 偵錯面板 ---
    let statusText = "";
    if (this.textures.exists('bg_map')) {
        statusText = "✅ 成功抓到 map.png";
        this.add.image(512, 384, 'bg_map').setOrigin(0.5);
    } else {
        statusText = "❌ 找不到 map.png！請檢查檔名大小寫";
        // 畫一個紅框代表地圖應該在的位置
        this.add.rectangle(512, 384, 800, 500).setStrokeStyle(4, 0xff0000);
    }

    this.add.text(10, 50, statusText, { 
        fontSize: '24px', 
        fill: '#fff', 
        backgroundColor: '#000' 
    });

    // 點擊顯示座標 (校對用)
    const coordText = this.add.text(10, 10, '座標偵測器', { fill: '#00ff00', backgroundColor: '#000' });
    this.input.on('pointerdown', (pointer) => {
        coordText.setText(`X: ${Math.floor(pointer.x)}, Y: ${Math.floor(pointer.y)}`);
    });
}
</script>
</body>
</html>
